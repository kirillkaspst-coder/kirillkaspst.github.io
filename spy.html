<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Шпион · Онлайн игра</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#0b1f12;font-family:system-ui;padding:20px}
        .card{max-width:700px;margin:auto;background:#0a1a0dd9;border-radius:48px;padding:24px;border:2px solid #e7b13b}
        h1{text-align:center;color:#ffeecc}
        .link-box{background:#00000066;border-radius:40px;padding:12px;margin:15px 0;word-break:break-all}
        button{background:#de9f3a;border:none;padding:12px 18px;border-radius:40px;font-weight:bold;margin:6px;cursor:pointer}
        .players{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
        .player{background:#2c5424;padding:8px 20px;border-radius:40px;color:#ffefbc}
        .word{font-size:2rem;text-align:center;margin:20px;font-weight:800;color:#ffdf8c}
        .hidden{display:none}
        .status{background:#04100799;border-radius:40px;padding:12px;margin-top:15px}
    </style>
</head>
<body>
<div class="card" id="app">
    <h1>🕵️‍♂️ ШПИОН · ОНЛАЙН 🕵️‍♀️</h1>
    <div id="hostView">
        <div class="link-box">🔗 Ссылка для друзей:<br><span id="gameLink"></span><br><button id="copyBtn">📋 Копировать</button></div>
        <div id="playersList" class="players"></div>
        <button id="startRoundBtn">🎲 НАЧАТЬ РАУНД</button>
        <button id="revealRoundBtn">🔍 РАСКРЫТЬ СЛОВО</button>
        <div id="wordDisplay" class="word">—</div>
        <div id="statusMsg" class="status"></div>
    </div>
    <div id="playerView" class="hidden">
        <div id="playerRole" style="font-size:1.8rem;font-weight:bold;text-align:center">🔍</div>
        <div id="playerWord" class="word">❓</div>
        <button id="readyBtn">✅ Я готов</button>
        <button id="spyBtn">🤫 Я шпион</button>
        <div id="playerMsg" class="status"></div>
    </div>
</div>
<script>
    // Публичное API (mockAPI) — работает всегда
    const API = 'https://67238b34493fac3cf24c2f33.mockapi.io/spy/v1/room';
    let roomId = localStorage.getItem('roomId');
    if(!roomId){ roomId = 'r'+Math.random().toString(36).substr(2,8); localStorage.setItem('roomId',roomId); }
    let playerId = localStorage.getItem('playerId');
    if(!playerId){ playerId = 'p'+Math.random().toString(36).substr(2,8); localStorage.setItem('playerId',playerId); }
    let playerName = localStorage.getItem('playerName');
    if(!playerName){ playerName = prompt('Ваше имя:','Агент')||'Агент'; localStorage.setItem('playerName',playerName); }
    let isHost = !location.search.includes('player=1');
    let syncTimer;

    async function getRoom(){ try{ let r=await fetch(`${API}/${roomId}`); if(r.status===404){ await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:roomId,players:{},gameState:{}})}); return {players:{},gameState:{}}; } return await r.json(); }catch(e){ return {players:{},gameState:{}}; } }
    async function saveRoom(data){ await fetch(`${API}/${roomId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); }

    async function updateUI(){
        let room = await getRoom();
        let players = room.players || {};
        let game = room.gameState || {};
        if(isHost){
            let pHtml = Object.values(players).filter(p=>p.name).map(p=>`<div class="player">${p.name} ${p.ready?'✅':'⏳'}</div>`).join('');
            document.getElementById('playersList').innerHTML = pHtml || '<span>✨ Ожидание игроков...</span>';
            if(game.active){
                document.getElementById('wordDisplay').innerHTML = game.word || '???';
                document.getElementById('statusMsg').innerHTML = `🎲 Раунд идёт! Шпион: ${game.spyName||'?'}`;
            } else { document.getElementById('wordDisplay').innerHTML = '—'; document.getElementById('statusMsg').innerHTML = '⚙️ Ожидание старта'; }
        } else {
            let my = players[playerId] || {};
            if(game.active){
                if(game.spyId === playerId){
                    document.getElementById('playerRole').innerHTML = '🕵️‍♂️ ВЫ — ШПИОН!';
                    document.getElementById('playerWord').innerHTML = '❓ ❓ ❓';
                    document.getElementById('playerMsg').innerHTML = 'Задавайте вопросы. Если уверены — нажмите "Я шпион"';
                } else {
                    document.getElementById('playerRole').innerHTML = '🔍 Вы — АГЕНТ';
                    document.getElementById('playerWord').innerHTML = game.word || '???';
                    document.getElementById('playerMsg').innerHTML = `Секретное слово: ${game.word}`;
                }
            } else {
                document.getElementById('playerRole').innerHTML = '🎭 Ожидание раунда';
                document.getElementById('playerWord').innerHTML = '❓';
                document.getElementById('playerMsg').innerHTML = 'Нажмите "Я готов" до начала игры';
            }
        }
    }

    if(isHost){
        document.getElementById('hostView').style.display='block';
        document.getElementById('playerView').style.display='none';
        let link = window.location.href.split('?')[0] + '?player=1';
        document.getElementById('gameLink').innerText = link;
        document.getElementById('copyBtn').onclick = ()=>{ navigator.clipboard.writeText(link); alert('Ссылка скопирована!'); };
        document.getElementById('startRoundBtn').onclick = async () => {
            let room = await getRoom();
            let players = room.players || {};
            let ready = Object.values(players).filter(p=>p.ready).length;
            if(ready<3){ alert(`Нужно минимум 3 игрока (готовы: ${ready})`); return; }
            let words = ["Аэропорт","Вокзал","Метро","Космодром","Стадион","Больница","Школа","Ресторан","Кинотеатр","Отель"];
            let word = words[Math.floor(Math.random()*words.length)];
            let ids = Object.keys(players);
            let spyId = ids[Math.floor(Math.random()*ids.length)];
            let spyName = players[spyId]?.name || 'Шпион';
            await saveRoom({ players, gameState: { active:true, word, spyId, spyName } });
            updateUI();
        };
        document.getElementById('revealRoundBtn').onclick = async () => {
            let room = await getRoom();
            let word = room.gameState?.word || 'неизвестно';
            alert(`Слово было: ${word}`);
            await saveRoom({ players: room.players || {}, gameState: { active:false } });
            updateUI();
        };
        setInterval(updateUI, 1200);
        updateUI();
    } else {
        document.getElementById('hostView').style.display='none';
        document.getElementById('playerView').style.display='block';
        (async ()=>{
            let room = await getRoom();
            let players = room.players || {};
            if(!players[playerId]) players[playerId] = { name:playerName, ready:false };
            await saveRoom({ players, gameState: room.gameState || {} });
            updateUI();
        })();
        document.getElementById('readyBtn').onclick = async () => {
            let room = await getRoom();
            let players = room.players || {};
            if(players[playerId]) players[playerId].ready = true;
            await saveRoom({ players, gameState: room.gameState || {} });
            alert('Вы готовы! Ждите начала раунда.');
        };
        document.getElementById('spyBtn').onclick = async () => {
            let room = await getRoom();
            let game = room.gameState || {};
            if(game.active && game.spyId === playerId){
                alert('🕵️ Шпион признал себя! Победа шпиона!');
                await saveRoom({ players: room.players || {}, gameState: { active:false } });
            } else { alert('Вы не шпион! Продолжайте играть.'); }
            updateUI();
        };
        setInterval(updateUI, 1200);
        updateUI();
    }
</script>
</body>
</html>
