<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Шпион · Игрок</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at 20% 30%, #0a1f12, #041007);
            font-family: system-ui, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0); }
            25%{ transform: translateX(-5px); }
            75%{ transform: translateX(5px); }
        }
        .glass-card {
            max-width: 550px;
            width: 100%;
            background: rgba(10, 22, 12, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 72px;
            padding: 32px 24px;
            border: 1px solid #f0bc64;
            animation: slideUp 0.5s ease;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #FFE3A4, #cc964a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .role-badge {
            font-size: 1.7rem;
            font-weight: bold;
            margin: 16px 0 8px;
            animation: pop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .word-block {
            background: #00000066;
            border-radius: 60px;
            padding: 24px;
            margin: 24px 0;
            transition: 0.1s;
        }
        .secret-word {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffeaad;
            word-break: break-word;
        }
        button {
            background: #f0ac3c;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 8px;
            cursor: pointer;
            transition: 0.05s linear;
            width: 80%;
        }
        button:active { transform: scale(0.95); }
        .btn-ready { background: #3c8c40; color: white; box-shadow: 0 0 6px #8aff80; }
        .btn-spy { background: #b7462a; color: white; }
        .status-msg { background: #00000044; border-radius: 40px; padding: 12px; margin-top: 20px; font-size: 0.8rem; }
        @keyframes glitter { 0% { text-shadow: 0 0 2px gold; } 100% { text-shadow: 0 0 12px #ffbf00; } }
        .spy-mode { animation: glitter 0.8s infinite alternate; }
    </style>
</head>
<body>
<div class="glass-card">
    <h1>🕵️‍♂️ ШПИОН | АГЕНТ 🕵️‍♀️</h1>
    <div id="playerArea">
        <div class="role-badge" id="roleText">🎭 Ожидание</div>
        <div class="word-block">
            <div id="wordReveal" class="secret-word">❓</div>
        </div>
        <button id="readyButton" class="btn-ready">✅ Я ГОТОВ</button>
        <button id="confessButton" class="btn-spy">🤫 Я ШПИОН</button>
        <div id="infoMsg" class="status-msg">Нажми «Я готов» и жди начала раунда</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB46jqj1G_jh4sU0gTRm9Wj4NErd2I4HvM",
        authDomain: "spy-game-global.firebaseapp.com",
        databaseURL: "https://spy-game-global-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "spy-game-global"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const roomRef = db.ref('/open_spy_room');
    
    let playerId = localStorage.getItem('playerId');
    if(!playerId){ playerId = 'p_'+Math.random().toString(36).substr(2,8); localStorage.setItem('playerId',playerId); }
    let playerName = localStorage.getItem('playerName');
    if(!playerName){ playerName = prompt("Введите ваше имя:","Агент") || "Агент"; localStorage.setItem('playerName',playerName); }
    
    async function registerPlayer() { await roomRef.child(`players/${playerId}`).set({ id:playerId, name:playerName, ready:false }); }
    registerPlayer();
    
    roomRef.child(`players/${playerId}/round`).on('value', snap => {
        const round = snap.val();
        if(round && round.isSpy !== undefined){
            if(round.isSpy){
                document.getElementById('roleText').innerHTML = '🕵️‍♂️ ВЫ — ШПИОН!';
                document.getElementById('wordReveal').innerHTML = '❓ ❓ ❓';
                document.getElementById('infoMsg').innerHTML = 'Задавайте вопросы, не выдавайте себя. Если уверены — нажмите «Я ШПИОН».';
                document.getElementById('roleText').classList.add('spy-mode');
            } else {
                document.getElementById('roleText').innerHTML = '🔍 ВЫ — АГЕНТ';
                document.getElementById('wordReveal').innerHTML = round.word || '???';
                document.getElementById('infoMsg').innerHTML = `Слово: ${round.word}. Помогите агентам найти шпиона.`;
                document.getElementById('roleText').classList.remove('spy-mode');
            }
        } else {
            document.getElementById('roleText').innerHTML = '🎭 Ожидание раунда';
            document.getElementById('wordReveal').innerHTML = '❓';
            document.getElementById('infoMsg').innerHTML = 'Нажмите «Я готов» до начала игры.';
        }
    });
    
    document.getElementById('readyButton').onclick = async () => {
        await roomRef.child(`players/${playerId}`).update({ ready: true });
        document.getElementById('infoMsg').innerHTML = '✅ Вы в игре! Ждите, ведущий начнёт раунд.';
        document.getElementById('readyButton').style.opacity = '0.6';
    };
    document.getElementById('confessButton').onclick = async () => {
        const snap = await roomRef.child('gameState').once('value');
        const game = snap.val();
        if(game && game.active && game.spyId === playerId){
            alert('🕵️ Шпион признал себя! ПОБЕДА ШПИОНА!');
            await roomRef.child('gameState').remove();
            await roomRef.child('players').once('value', s => { for(let id in s.val()) roomRef.child(`players/${id}/round`).remove(); });
        } else {
            alert('❌ Вы не шпион! Продолжайте помогать агентам.');
        }
    };
</script>
</body>
</html>
