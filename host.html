<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпион · Ведущий</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a1f12 0%, #051408 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 24px;
            min-height: 100vh;
        }
        /* плавное появление */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 200, 100, 0.6); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(255, 200, 100, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 200, 100, 0); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: rgba(10, 25, 16, 0.75);
            backdrop-filter: blur(14px);
            border-radius: 64px;
            padding: 32px 28px;
            border: 1px solid #f2bc5c;
            animation: fadeUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #FFE6B0, #d6952c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #cde6b3;
            margin-bottom: 28px;
            font-weight: 500;
        }
        .link-card {
            background: #00000055;
            border-radius: 56px;
            padding: 18px;
            text-align: center;
            margin-bottom: 28px;
            transition: all 0.2s;
        }
        .link-text {
            font-family: monospace;
            font-size: 1rem;
            background: #1f321b;
            padding: 12px 16px;
            border-radius: 48px;
            word-break: break-all;
            color: #ffe5a3;
            margin: 12px 0;
        }
        .glow-btn {
            background: #e8a83a;
            border: none;
            padding: 12px 28px;
            border-radius: 48px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s linear;
            margin: 6px;
        }
        .glow-btn:active { transform: scale(0.96); }
        .players-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 24px 0;
            min-height: 100px;
        }
        .player-tag {
            background: #295724bf;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 10px 24px;
            color: #fef0c8;
            font-weight: bold;
            animation: bounceIn 0.3s ease-out;
            border-left: 4px solid #ffcd6b;
        }
        .player-ready { background: #437a35; box-shadow: 0 0 8px #d4ffaa; }
        .word-card {
            background: #00000066;
            border-radius: 56px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .big-word {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #fddf92;
            word-break: break-word;
            animation: pulse 1.2s infinite;
        }
        .status {
            background: #061a0ab3;
            border-radius: 40px;
            padding: 12px;
            margin-top: 20px;
        }
        @media (max-width: 650px) { .container { padding: 20px; } h1 { font-size: 1.8rem; } .big-word { font-size: 1.8rem; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🕵️‍♂️ ХОСТ | ШПИОН 🕵️‍♀️</h1>
    <div class="sub">Управляй игрой — запускай раунды, следи за шпионом</div>
    
    <div class="link-card">
        🔗 ПРИГЛАСИ ДРУЗЕЙ:
        <div class="link-text" id="inviteLink">Загрузка...</div>
        <button class="glow-btn" id="copyLinkBtn">📋 КОПИРОВАТЬ ССЫЛКУ</button>
    </div>

    <div id="playersList" class="players-grid">✨ Ожидание игроков...</div>

    <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
        <button class="glow-btn" id="startGameBtn">🎲 НАЧАТЬ РАУНД</button>
        <button class="glow-btn" id="revealGameBtn">🔍 РАСКРЫТЬ СЛОВО</button>
    </div>

    <div class="word-card">
        <div>📖 СЛОВО РАУНДА</div>
        <div id="currentWord" class="big-word">—</div>
        <div id="gameStatus" class="status">⚙️ Ожидание старта</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB46jqj1G_jh4sU0gTRm9Wj4NErd2I4HvM",
        authDomain: "spy-game-global.firebaseapp.com",
        databaseURL: "https://spy-game-global-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "spy-game-global"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const roomRef = db.ref('/open_spy_room');

    let players = {};
    let gameActive = false;
    let currentWord = "";
    let currentSpyId = "";

    roomRef.child('players').on('value', snap => {
        players = snap.val() || {};
        updatePlayersUI();
    });
    roomRef.child('gameState').on('value', snap => {
        const state = snap.val() || {};
        gameActive = state.active || false;
        currentWord = state.word || "";
        currentSpyId = state.spyId || "";
        document.getElementById('currentWord').innerHTML = currentWord || "—";
        document.getElementById('gameStatus').innerHTML = gameActive ? `🎲 Раунд идёт! Шпион: ${state.spyName || '?'}` : "⚙️ Ожидание старта";
        if(gameActive && currentWord) document.getElementById('currentWord').style.animation = 'pulse 0.6s';
    });

    function updatePlayersUI() {
        const container = document.getElementById('playersList');
        const playersArr = Object.values(players).filter(p => p.name);
        if(playersArr.length === 0) {
            container.innerHTML = '<span style="color:#aaa;">✨ Игроки появятся здесь...</span>';
            return;
        }
        container.innerHTML = playersArr.map(p => `
            <div class="player-tag ${p.ready ? 'player-ready' : ''}">
                ${p.name} ${p.ready ? '✅' : '⏳'}
                ${gameActive && p.id === currentSpyId ? '🕵️‍♂️' : ''}
            </div>
        `).join('');
    }

    const inviteLink = window.location.href.split('?')[0].replace('host.html', 'player.html') + '?room=open_spy_room';
    document.getElementById('inviteLink').innerText = inviteLink;
    document.getElementById('copyLinkBtn').onclick = () => { navigator.clipboard.writeText(inviteLink); alert('Ссылка скопирована! Отправь друзьям.'); };

    document.getElementById('startGameBtn').onclick = async () => {
        const readyPlayers = Object.values(players).filter(p => p.ready);
        if(readyPlayers.length < 3) { alert(`⚠️ Недостаточно игроков (готовы ${readyPlayers.length} / нужно 3+).`); return; }
        const words = ["Аэропорт","Вокзал","Метро","Космодром","Остров","Замок","Больница","Школа","Ресторан","Кинотеатр","Тюрьма","Подлодка"];
        const word = words[Math.floor(Math.random() * words.length)];
        const ids = Object.keys(players);
        const spyId = ids[Math.floor(Math.random() * ids.length)];
        const spyName = players[spyId]?.name || "Шпион";
        await roomRef.child('gameState').set({ active: true, word, spyId, spyName });
        await roomRef.child('players').once('value', async snap => {
            for(let id in snap.val()) await roomRef.child(`players/${id}/round`).set({ isSpy: (id === spyId), word: (id === spyId) ? null : word });
        });
    };

    document.getElementById('revealGameBtn').onclick = async () => {
        const word = currentWord || "неизвестно";
        alert(`🔍 Слово раунда: ${word}\n🕵️ Шпион: ${players[currentSpyId]?.name || '?'}`);
        await roomRef.child('gameState').remove();
        await roomRef.child('players').once('value', snap => { for(let id in snap.val()) roomRef.child(`players/${id}/round`).remove(); });
    };
</script>
</body>
</html>
